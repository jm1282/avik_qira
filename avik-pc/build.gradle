plugins {
    id "java"
    id "idea"
    alias libs.plugins.kotlinJvm
}

repositories {
    maven {
        url 'https://artifacts.mot.com:443/artifactory/gradle-dev'
        // See how to configure credentials at https://confluence.mot.com/display/LT/Gradle
        credentials {
            username = artifactoryUsername
            password = artifactoryPassword
        }
    }
    mavenCentral()
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: [])
    implementation libs.kotlin.stdlib
    implementation libs.kotlinx.serialization
    implementation libs.kotlinx.coroutines
    implementation libs.windows.ui.automation
    implementation libs.jna
    implementation libs.jna.platform
    implementation libs.junit.platform
    implementation libs.gson
    implementation libs.icu4j
    implementation libs.frevo.common
    implementation libs.avik.windows.client
    implementation libs.avik.common
    implementation libs.avik.screenshot
    implementation libs.avik.interaction
}

tasks.register('runScript', JavaExec) {
    doFirst {
        def screenFolderDir = file(screen_folder)
        screenFolderDir.mkdirs()
        systemProperty 'screen_folder', screenFolderDir.absolutePath
        systemProperty 'locale', locale
        systemProperty 'build_label', build_label
        systemProperty 'script', avik_script
        systemProperty "isDelta", project.findProperty("isDelta") ?: "false"
    }
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "org.junit.platform.console.ConsoleLauncher"
    args = [
            "-c=${avik_script}",
            "--disable-ansi-colors",
            "--disable-banner",
            "--details=none"
    ]
}
