kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
# Gradle 8.7 (required by AGP 8.6.1) cannot run on the JDK 25 pointed to by
# JAVA_HOME, and AGP 8.6.1 requires JDK 17. Pin the Gradle build JVM to the
# locally-provisioned Temurin 17 so the command-line build stays consistent
# regardless of JAVA_HOME. Machine-specific path.
org.gradle.java.home=C:/Users/BLR-USER/.gradle/jdks/eclipse_adoptium-17-amd64-windows/jdk-17.0.18+8
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 \
--enable-native-access=ALL-UNNAMED \
--add-exports=java.base/sun.nio.ch=ALL-UNNAMED \
--add-opens=java.base/java.lang=ALL-UNNAMED \
--add-opens=java.base/java.lang.reflect=ALL-UNNAMED \
--add-opens=java.base/java.io=ALL-UNNAMED \
--add-exports=jdk.unsupported/sun.misc=ALL-UNNAMED
android.suppressUnsupportedCompileSdk=35
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
